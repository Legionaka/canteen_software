{% extends "base.html" %}
{% block title %}Log in · CampusEats{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h1 class="h-display">Welcome back</h1>
    <p class="muted">Sign in to order from the canteen.</p>

    <form method="POST" action="{{ url_for('auth.login') }}" class="form">
      <label class="field">
        <span>Email</span>
        <input type="email" name="email" placeholder="you@campus.ac.za" required autofocus>
      </label>

      <label class="field">
        <span>Password</span>
        <input type="password" name="password" placeholder="••••••••" required>
      </label>

      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <p class="muted center small">
      No account? <a href="{{ url_for('auth.register') }}">Register as a student</a>
    </p>
  </div>
</div>
{% endblock %}
