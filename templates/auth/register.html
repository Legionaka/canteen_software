{% extends "base.html" %}
{% block title %}Register · CampusEats{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h1 class="h-display">Create your account</h1>
    <p class="muted">Students only — staff accounts are created by an admin.</p>

    <form method="POST" action="{{ url_for('auth.register') }}" class="form">
      <label class="field">
        <span>Full name</span>
        <input type="text" name="name" placeholder="Tino M" required autofocus>
      </label>

      <label class="field">
        <span>Student number</span>
        <input type="text" name="student_number" placeholder="STU2024001" required>
      </label>

      <label class="field">
        <span>Email</span>
        <input type="email" name="email" placeholder="you@campus.ac.za" required>
      </label>

      <label class="field">
        <span>Password</span>
        <input type="password" name="password" placeholder="At least 8 characters" minlength="8" required>
      </label>

      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>

    <p class="muted center small">
      Already registered? <a href="{{ url_for('auth.login') }}">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
